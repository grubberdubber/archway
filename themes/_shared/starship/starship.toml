# Android Mount — starship. Generated by archway; do not edit.
# Selected with STARSHIP_CONFIG=~/.config/archway/theme.d/starship.toml

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 500

format = """
[](fg:@primary@)$os$username$hostname$container[](fg:@primary@ bg:@surface@)$directory\
[](fg:@surface@ bg:@surface_alt@)$git_branch$git_status${custom.venv}${custom.vpn}$status\
[](fg:@surface_alt@ bg:@bg@)$cmd_duration$character"""

palette = "android_mount"

[palettes.android_mount]
bg = "@bg@"
surface = "@surface@"
surface_alt = "@surface_alt@"
text = "@text@"
text_muted = "@text_muted@"
primary = "@primary@"
secondary = "@secondary@"
tertiary = "@tertiary@"
error = "@error@"

[os]
style = "bg:@surface@ fg:@primary@"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[directory]
style = "bg:@surface@ fg:@text@"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bg:@surface_alt@ fg:@secondary@"
format = "[ $symbol$branch ]($style)"
symbol = "󰊢 "

[git_status]
style = "bg:@surface_alt@ fg:@tertiary@"
format = "[$all_status$ahead_behind ]($style)"

# Double chevrons as in the reference prompt, unboxed on the terminal
# background: `❯❯` green normally, yellow in vi command mode, red after a
# failure. A literal `>>` was dropped because it reads as shell redirection.
[character]
success_symbol = "[❯❯](bold @success@)"
error_symbol = "[❯❯](bold @error@)"
vimcmd_symbol = "[❯❯](bold @tertiary@)"

[cmd_duration]
# 100 ms, not 800: while writing scripts the interesting commands are the short
# ones, and millisecond precision is what tells a good loop from a bad one.
# Muted text without a background: a filled block here read as a stray widget.
min_time = 100
show_milliseconds = true
style = "fg:@text_muted@"
format = "[ $duration ]($style)"

[hostname]
ssh_only = true
style = "bg:@surface@ fg:@text_muted@"
format = "[ $hostname ]($style)"

[username]
# Shown only for root or over SSH: user@host is a privilege warning, not decor.
show_always = false
style_user = "bg:@surface@ fg:@text_muted@"
style_root = "bg:@error@ fg:@bg@ bold"
format = "[ $user ]($style)"

[status]
# Only appears when the previous command failed, next to its exit code.
disabled = false
style = "bg:@surface_alt@ fg:@error@"
symbol = "✘ "
format = "[ $symbol$status ]($style)"

[container]
# Built-in detection for docker/podman/toolbox/systemd-nspawn.
style = "bg:@surface@ fg:@tertiary@"
symbol = "󰏖 "
format = "[ $symbol$name ]($style)"

[custom.venv]
# Active Python virtualenv, so test tooling is never confused with the system.
when = 'test -n "$VIRTUAL_ENV"'
command = 'printf "%s" "${VIRTUAL_ENV##*/}"'
style = "bg:@surface_alt@ fg:@secondary@"
format = "[ 󰌠 $output ]($style)"

[custom.vpn]
# Lab/VPN interface and its IPv4, so you always know which network you are on.
when = 'test -d /sys/class/net/tun0 || test -d /sys/class/net/wg0'
command = 'for i in tun0 wg0; do if [ -d "/sys/class/net/$i" ]; then ip -4 -o addr show "$i" 2>/dev/null | awk "{print \$4}" | cut -d/ -f1; break; fi; done'
style = "bg:@surface_alt@ fg:@tertiary@"
format = "[ 󰦝 $output ]($style)"

# Android Mount — starship. Generated by archway; do not edit.
# Selected with STARSHIP_CONFIG=~/.config/archway/theme.d/starship.toml
#
# Flat prompt: every module paints its foreground on the terminal background.
# Filled segment backgrounds were removed; they read as stray widgets in a
# transparent terminal and fought the wallpaper.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 500

format = """
$os$username$hostname$container$directory\
$git_branch$git_status${custom.venv}${custom.vpn}$status$cmd_duration $character"""

palette = "android_mount"

[palettes.android_mount]
bg = "@bg@"
surface = "@surface@"
surface_alt = "@surface_alt@"
text = "@text@"
text_muted = "@text_muted@"
primary = "@primary@"
secondary = "@secondary@"
tertiary = "@tertiary@"
error = "@error@"
purple = "@purple@"
orange = "@orange@"

[os]
style = "fg:@primary@"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[directory]
# Red paths: the reference prompt marks the working directory in red, and it is
# the first thing the eye should find when a command fails.
style = "fg:@error@"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
# `` keeps the purple of the reference prompt and the branch name stays
# yellow, independent of the rest of the palette.
style = "fg:@purple@"
format = "[$symbol](fg:@purple@)[$branch](fg:@tertiary@)"
symbol = "\ue725 "

[git_status]
# `!?` (dirty markers) in orange, so they stand out without competing with the
# yellow branch name. Each module owns one leading space and no trailing one.
style = "fg:@orange@"
format = "[ $all_status$ahead_behind]($style)"

# Double chevrons as in the reference prompt: `❯❯` green normally, yellow in vi
# command mode, red after a failure. A literal `>>` was dropped because it reads
# as shell redirection.
[character]
success_symbol = "[❯❯](bold @success@)"
error_symbol = "[❯❯](bold @error@)"
vimcmd_symbol = "[❯❯](bold @tertiary@)"

[cmd_duration]
# 100 ms, not 800: while writing scripts the interesting commands are the short
# ones, and millisecond precision is what tells a good loop from a bad one.
min_time = 100
show_milliseconds = true
# Cyan instead of muted grey: the duration is easy to spot at a glance.
style = "fg:@secondary@"
format = "[ $duration]($style)"

[hostname]
ssh_only = true
style = "fg:@text_muted@"
format = "[ $hostname ]($style)"

[username]
# Shown only for root or over SSH: user@host is a privilege warning, not decor.
show_always = false
style_user = "fg:@text_muted@"
style_root = "fg:@error@ bold"
format = "[ $user ]($style)"

[status]
# Only appears when the previous command failed, next to its exit code.
disabled = false
style = "fg:@error@"
symbol = "✘ "
format = "[ $symbol$status]($style)"

[container]
# Built-in detection for docker/podman/toolbox/systemd-nspawn.
style = "fg:@tertiary@"
symbol = "󰏖 "
format = "[ $symbol$name ]($style)"

[custom.venv]
# Active Python virtualenv, so test tooling is never confused with the system.
when = 'test -n "$VIRTUAL_ENV"'
command = 'printf "%s" "${VIRTUAL_ENV##*/}"'
style = "fg:@secondary@"
format = "[ 󰌠 $output]($style)"

[custom.vpn]
# Lab/VPN interface and its IPv4, so you always know which network you are on.
when = 'test -d /sys/class/net/tun0 || test -d /sys/class/net/wg0'
command = 'for i in tun0 wg0; do if [ -d "/sys/class/net/$i" ]; then ip -4 -o addr show "$i" 2>/dev/null | awk "{print \$4}" | cut -d/ -f1; break; fi; done'
style = "fg:@tertiary@"
format = "[ 󰦝 $output]($style)"

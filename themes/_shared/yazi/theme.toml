# Archway — Yazi theme rendered from palette.toml. Generated; do not edit.
#
# Yazi falls back to its built-in defaults for any key left out, so this file
# only states what the palette decides. Icons are deliberately absent: the
# terminal font already ships them, and a second set only drifts.
#
# Square everywhere: no powerline separators and no pill padding, matching the
# rest of the desktop (AGENTS.md §9.2). The hovered row in the preview pane is
# filled instead of underlined — an underline inherits the file-type colour and
# showed up as a stray blue line down the right-hand panel.

[flavor]
dark = ""
light = ""

[app]
overall = {}

[mgr]
cwd = { fg = "@primary@" }
find_keyword = { fg = "@warning@", bold = true, underline = true }
find_position = { fg = "@tertiary@", bold = true, italic = true }
symlink_target = { fg = "@text_muted@", italic = true }

marker_copied = { fg = "@secondary@", bg = "@secondary@" }
marker_cut = { fg = "@error@", bg = "@error@" }
marker_marked = { fg = "@primary@", bg = "@primary@" }
marker_selected = { fg = "@tertiary@", bg = "@tertiary@" }
marker_symbol = "│"

count_copied = { fg = "@bg@", bg = "@secondary@" }
count_cut = { fg = "@bg@", bg = "@error@" }
count_selected = { fg = "@bg@", bg = "@tertiary@" }

border_symbol = "│"
border_style = { fg = "@border@" }
syntect_theme = ""

[tabs]
active = { fg = "@bg@", bg = "@primary@", bold = true }
inactive = { fg = "@text_muted@", bg = "@surface_alt@" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "@bg@", bg = "@primary@", bold = true }
normal_alt = { fg = "@primary@", bg = "@surface_alt@" }
select_main = { fg = "@bg@", bg = "@secondary@", bold = true }
select_alt = { fg = "@secondary@", bg = "@surface_alt@" }
unset_main = { fg = "@bg@", bg = "@error@", bold = true }
unset_alt = { fg = "@error@", bg = "@surface_alt@" }

[indicator]
parent = { bg = "@surface_alt@" }
current = { bg = "@selection_bg@" }
preview = { bg = "@overlay@" }
padding = { open = "", close = "" }

[status]
overall = {}
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "@text_muted@" }
perm_type = { fg = "@secondary@" }
perm_read = { fg = "@tertiary@" }
perm_write = { fg = "@error@" }
perm_exec = { fg = "@primary@" }

progress_label = { bold = true }
progress_normal = { fg = "@secondary@", bg = "@surface_alt@" }
progress_error = { fg = "@warning@", bg = "@error@" }

[which]
cols = 3
mask = { bg = "@bg@" }
cand = { fg = "@primary@" }
rest = { fg = "@text_muted@" }
desc = { fg = "@secondary@" }
separator = "  "
separator_style = { fg = "@border@" }

[confirm]
border = { fg = "@primary@" }
title = { fg = "@primary@" }
body = {}
list = {}
btn_yes = { fg = "@bg@", bg = "@primary@", bold = true }
btn_no = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "@primary@" }
title = { fg = "@primary@" }
tbl_col = { fg = "@primary@" }
tbl_cell = { fg = "@tertiary@", reversed = true }

[notify]
title_info = { fg = "@secondary@" }
title_warn = { fg = "@warning@" }
title_error = { fg = "@error@" }

[pick]
border = { fg = "@primary@" }
active = { fg = "@primary@", bold = true }
inactive = {}

[input]
border = { fg = "@primary@" }
title = {}
value = {}
selected = { bg = "@selection_bg@" }

[cmp]
border = { fg = "@primary@" }
active = { bg = "@selection_bg@" }
inactive = {}

[tasks]
border = { fg = "@primary@" }
title = {}
hovered = { fg = "@primary@", bold = true }

[help]
on = { fg = "@secondary@" }
run = { fg = "@tertiary@" }
desc = {}
hovered = { bg = "@selection_bg@", bold = true }
footer = { fg = "@bg@", bg = "@surface_alt@" }

[filetype]
rules = [
	{ mime = "image/*", fg = "@tertiary@" },
	{ mime = "{audio,video}/*", fg = "@secondary@" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "@error@" },
	{ mime = "application/{pdf,doc,rtf}", fg = "@primary@" },
	{ mime = "vfs/{absent,stale}", fg = "@text_muted@" },
	{ url = "*", is = "orphan", bg = "@error@" },
	{ url = "*", is = "exec", fg = "@success@" },
	{ url = "*", is = "dummy", bg = "@error@" },
	{ url = "*/", is = "dummy", bg = "@error@" },
	{ url = "*/", fg = "@primary@" },
]

# Archway — mpv OSD. Generated; included from ~/.config/mpv/mpv.conf.
# mpv colours are #AARRGGBB, so every value gets an opaque alpha prefix.

osd-color="#FF@text:hex@"
osd-border-color="#FF@bg:hex@"
osd-back-color="#CC@surface:hex@"
osd-shadow-offset=0
osd-font-size=30

# The progress bar has no colours of its own: mpv draws it with osd-color and
# osd-back-color, so the accent above is what the bar uses.
osd-bar-align-y=0.95
osd-bar-w=80

sub-color="#FFFFFFFF"
sub-border-color="#FF@bg:hex@"
sub-shadow-offset=0

# The seek bar and the cache indicator share the accent so the OSD reads as one
# control instead of three unrelated sliders.
osd-playing-msg=""

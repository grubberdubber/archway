# Android Mount — hyprlock. Generated by archway; do not edit.
# Sourced from ~/.config/hypr/hyprlock.conf.

background {
    monitor =
    color = 0xff@bg:hex@
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = @focus_width@
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_text_format = *
    outer_color = 0xff@primary:hex@
    inner_color = 0xff@surface_alt:hex@
    font_color = 0xff@text:hex@
    fade_on_empty = false
    rounding = @radius_input@
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_color = 0xff@error:hex@
}

label {
    monitor =
    text = $TIME
    color = 0xff@text:hex@
    font_size = 72
    font_family = @font_ui@
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = 0xff@text_muted:hex@
    font_size = 12
    font_family = @font_ui@
    position = 0, 40
    halign = center
    valign = bottom
}

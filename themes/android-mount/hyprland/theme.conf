# Android Mount — Hyprland colours. Generated by archway; do not edit.
# Sourced from ~/.config/hypr/hyprland.conf.

general {
    col.active_border   = 0xff@primary:hex@ 0xff@secondary:hex@ 45deg
    col.inactive_border = 0xaa@border:hex@
    border_size         = @border_width@
    gaps_in             = 6
    gaps_out            = @padding@
    resize_on_border    = true
}

decoration {
    rounding       = @radius_window@
    active_opacity = @opacity@
    inactive_opacity = 0.92

    blur {
        enabled           = true
        size              = 6
        passes            = 2
        new_optimizations = true
    }

    shadow {
        enabled      = true
        range        = 12
        render_power = 3
        color        = 0x66000000
    }
}

group {
    col.border_active   = 0xff@primary:hex@
    col.border_inactive = 0xaa@border:hex@
    groupbar {
        text_color       = 0xff@text:hex@
        col.active       = 0xff@selection_bg:hex@
        col.inactive     = 0xff@surface_alt:hex@
    }
}

# Android Mount — starship. Generated by archway; do not edit.
# Selected with STARSHIP_CONFIG=~/.config/archway/theme.d/starship.toml

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 500

format = """
[](fg:@primary@)$os[](fg:@primary@ bg:@surface@)$directory\
[](fg:@surface@ bg:@surface_alt@)$git_branch$git_status\
[](fg:@surface_alt@ bg:@bg@)$character"""

palette = "android_mount"

[palettes.android_mount]
bg = "@bg@"
surface = "@surface@"
surface_alt = "@surface_alt@"
text = "@text@"
text_muted = "@text_muted@"
primary = "@primary@"
secondary = "@secondary@"
tertiary = "@tertiary@"
error = "@error@"

[os]
style = "bg:@surface@ fg:@primary@"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[directory]
style = "bg:@surface@ fg:@text@"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bg:@surface_alt@ fg:@secondary@"
format = "[ $symbol$branch ]($style)"
symbol = "󰊢 "

[git_status]
style = "bg:@surface_alt@ fg:@tertiary@"
format = "[$all_status$ahead_behind ]($style)"

[character]
success_symbol = "[❯](bold @secondary@)"
error_symbol = "[❯](bold @error@)"
vimcmd_symbol = "[❮](bold @tertiary@)"

[cmd_duration]
min_time = 800
style = "bg:@surface_alt@ fg:@text_muted@"
format = "[ took $duration ]($style)"

[hostname]
ssh_only = true
style = "bg:@surface@ fg:@text_muted@"
format = "[ $hostname ]($style)"

# Android Mount — dunst colours. Generated by archway; do not edit.
# Drop-in loaded from ~/.config/dunst/dunstrc.d/ (dunst >= 1.9).

[global]
    frame_color = "@primary@"
    separator_color = frame
    font = @font_ui@ @font_size@
    corner_radius = @radius_window@
    offset = @padding@x@padding@
    width = 380

[urgency_low]
    background = "@surface@"
    foreground = "@text_muted@"
    frame_color = "@border@"
    timeout = 6

[urgency_normal]
    background = "@surface_alt@"
    foreground = "@text@"
    frame_color = "@primary@"
    timeout = 10

[urgency_critical]
    background = "@surface_alt@"
    foreground = "@text@"
    frame_color = "@error@"
    timeout = 0

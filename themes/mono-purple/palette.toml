# Monochrome Purple — single-hue accent over the Android Mount dark surface.
# Hand-written, contrast-checked by `archway theme validate`.
# Applications ship one template set in themes/_shared; only the palette changes.

[palette]
theme_name  = "Monochrome Purple"
bg          = "#0B0F14"
surface     = "#11161D"
surface_alt = "#1A212B"
overlay     = "#222B37"
border      = "#2A3441"
text        = "#E6EDF3"
text_muted  = "#9BA7B4"
primary     = "#C6A8F2"
secondary   = "#D5BDF7"
tertiary    = "#E2D2FA"
error       = "#F28B82"
warning     = "#FDD663"
success     = "#81C995"
selection   = "#C6A8F2"
selection_bg = "#251F31"

[geometry]
radius_window = 12
radius_input  = 8
radius_pill   = 999
padding       = 12
border_width  = 1
focus_width   = 2

[typography]
font_mono     = "JetBrainsMono Nerd Font"
font_ui       = "Inter"
font_fallback = "Noto Sans"
font_size     = 11

[effects]
opacity      = 0.98
transitions  = 120
reduce_motion = 1

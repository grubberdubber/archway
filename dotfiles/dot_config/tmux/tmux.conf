# Archway tmux — fast startup, vi keys, no plugin manager in the critical path.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Default numbering: C-b 0..9 selects a window and 0 is a real window.
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
# Default prefix (C-b). C-b C-b sends a literal C-b to the pane.
unbind C-b
set -g prefix C-b
bind C-b send-prefix
set -g detach-on-destroy off
set -g status-interval 5
set -g visual-activity off
set -g visual-bell off
set -g monitor-bell off
set -g bell-action none
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Vi-style copy mode and navigation
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Splits and panes without the prefix
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload and session helpers
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "tmux reloaded"
bind C-s command-prompt -p "session name:" "new-session -d -s '%%'"
bind S choose-tree -Zs

# Stay in the same directory when creating windows/sessions
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Theme (generated by `archway theme set`)
if-shell 'test -r "$HOME/.config/archway/theme.d/tmux.conf"' \
  'source-file "$HOME/.config/archway/theme.d/tmux.conf"'

# Minimal plugin-free status bar; tmux-resurrect is opt-in, not a dependency.
set -g status-right-length 60
set -g window-status-separator ""
set -g pane-border-status off

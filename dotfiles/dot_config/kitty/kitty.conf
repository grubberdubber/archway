# Archway kitty — fast, keyboard-first, themed by Android Mount.
# Colours live in ~/.config/archway/theme.d/kitty.conf (generated).

include ~/.config/archway/theme.d/kitty.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

adjust_line_height 105%
disable_ligatures never
text_composition_strategy legacy

window_padding_width 12
placement_strategy   center
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.96
dynamic_background_opacity yes

scrollback_lines 10000
wheel_scroll_multiplier 5
mouse_hide_wait 2.0
detect_urls yes

cursor_shape          beam
cursor_blink_interval 0
cursor_stop_blinking_after 15

enable_audio_bell no
visual_bell_duration 0.0
update_check_interval 0

allow_remote_control socket-only
listen_on unix:/tmp/kitty-archway-{kitty_pid}

# Tabs and layouts
tab_bar_edge bottom
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_title_template "{index}: {title}"

enabled_layouts splits,stack
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+| launch --location=vsplit
map ctrl+shift+z toggle_layout stack
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+w close_tab
map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+0 reset_font_size
map ctrl+shift+f5 reload_config

# Clickable hints for URLs and hashes
map ctrl+shift+o open_url_with_hints

# Keep the terminal usable without a mouse.
map ctrl+shift+up   scroll_line_up
map ctrl+shift+down scroll_line_down

shell_integration enabled

# Archway kitty — fast, keyboard-first, themed by Android Mount.
# Colours live in ~/.config/archway/theme.d/kitty.conf (generated).

include ~/.config/archway/theme.d/kitty.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

adjust_line_height 105%

# Ligatures off on purpose. JetBrains Mono turns `==`, `==>`, `>=`, `<=`, `!=`
# and `->` into single glyphs, which corrupts code review in the terminal and in
# Neovim (a two-character operator looks like a math symbol or an arrow). The
# font stays the same; only the ligature substitution is disabled.
disable_ligatures always
text_composition_strategy legacy

# No inner padding: it shows as a frame in the terminal colour around apps that
# paint their own background (Neovim), which reads as a ghost border inside.
window_padding_width 0
placement_strategy   center
hide_window_decorations yes
confirm_os_window_close 0

# Transparency: the wallpaper shows through the terminal, but never through the
# text (foreground stays fully opaque). 0.92 is the point where the terminal
# still reads as a solid surface on a dark wallpaper; Hyprland paints no blur,
# so anything lighter becomes noise behind the code. Terminals are square and
# have no inner padding, so there is no ghost frame over the grid.
background_opacity 0.92
dynamic_background_opacity yes

scrollback_lines 10000
wheel_scroll_multiplier 5
# Touchpad scrolling: one line per tick. Higher values flood Neovim with wheel
# events, which then look "stuck" at the end of a buffer because the queued
# events keep it pinned until the queue drains.
touch_scroll_multiplier 1.0
# Line-based scrolling. kitty >= 0.46 turns Wayland touchpad gestures into pixel
# deltas and adds its own momentum, so scrolling a markdown buffer in Neovim kept
# moving after the fingers stopped and a wheel-up at the end of the file looked
# ignored (sub-line deltas accumulate instead of producing a scroll event).
# Discrete lines make the gesture stop exactly when the fingers stop.
pixel_scroll no
mouse_hide_wait 2.0
detect_urls yes

cursor_shape          beam
cursor_blink_interval 0
cursor_stop_blinking_after 15

enable_audio_bell no
visual_bell_duration 0.0
update_check_interval 0

allow_remote_control socket-only
listen_on unix:/tmp/kitty-archway-{kitty_pid}

# Tabs and layouts
tab_bar_edge bottom
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_title_template "{index}: {title}"

enabled_layouts splits,stack
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+| launch --location=vsplit
map ctrl+shift+z toggle_layout stack
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+w close_tab
map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+0 reset_font_size
map ctrl+shift+f5 reload_config

# Clickable hints for URLs and hashes
map ctrl+shift+o open_url_with_hints

# Keep the terminal usable without a mouse.
map ctrl+shift+up   scroll_line_up
map ctrl+shift+down scroll_line_down

shell_integration enabled

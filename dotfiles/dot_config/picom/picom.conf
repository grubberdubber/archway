# Archway picom — soft shadows, real transparency, reduced motion respected.
# If you set `reduce_motion = 1` in the palette, this file still works: the
# theme reload disables fading by restarting picom with --no-fading-openclose.

backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.45;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'floating-term'",
  "name = 'Notification'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 0.97;
active-opacity = 1.0;
frame-opacity = 0.98;
inactive-opacity-override = false;

blur-background = false;
detect-client-opacity = true;
detect-rounded-corners = true;

unredir-if-possible = true;
refresh-rate = 0;

# Avoid tearing in video players and games.
[class_g = 'mpv']
opacity = 1.0;

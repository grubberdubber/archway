# atuin — private-by-default shell history.
# Sync is opt-in and encrypted end to end; Archway never enables it for you.

auto_sync = false
update_check = false
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
search_mode_shell_up_key_binding = "prefix"
# Reference layout: compact picker, Search/Inspect tabs, `GLOBAL` filter line
# and a short preview of the highlighted command. Entries stay chronological
# (oldest on top, newest on the bottom, where the cursor starts).
style = "compact"
inline_height = 20
invert = false
show_preview = true
max_preview_height = 4
show_help = false
show_tabs = true
exit_mode = "return-original"
keymap_mode = "vim-normal"
enter_accept = true

# Never record commands that are likely to carry secrets.
history_filter = [
  "^\\s*export\\s+.*(TOKEN|SECRET|KEY|PASSWORD|PASSWD)=",
  "^\\s*(bw|rbw)\\s+",
  "^\\s*pass\\s+",
  "^\\s*gpg\\s+.*--passphrase",
  "^\\s*ssh-add\\s+.*-",
  "^\\s*curl\\s+.*(-u|--user|--header\\s+['\"]?Authorization)",
  "^\\s*op\\s+",
  "^\\s*curl\\s+.*token=",
  "^\\s*mysql.*-p",
  "^\\s*psql\\s+.*password=",
]

[stats]
common_prefix = ["sudo"]

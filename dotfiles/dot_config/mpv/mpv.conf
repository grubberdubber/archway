# mpv — one player for video, audio and streams. Square, borderless, keyboard
# only. Colours follow the Android Mount palette.

# --- Output -------------------------------------------------------------
# auto-safe picks VA-API on Intel/AMD and NVDEC on NVIDIA, and falls back to
# software when the driver cannot decode the codec. It is the only hwdec mode
# that does not produce corrupt frames on unsupported streams.
vo=gpu
hwdec=auto-safe
gpu-api=auto
profile=fast

# The window is the video: no border, no titlebar decorations.
border=no
ontop=yes
keep-open=yes
keep-open-pause=no

# Remember where a long video was left, and start where it stopped.
save-position-on-quit=yes
watch-later-directory=~/.local/state/mpv/watch_later

# --- Interface ----------------------------------------------------------
# OSD colours are generated by `archway theme set` (themes/_shared/mpv) so the
# player follows the desktop palette; a missing file leaves mpv's defaults.
include="~/.config/archway/theme.d/mpv-theme.conf"

osc=yes
osd-bar=yes
osd-duration=1200
osd-font="JetBrainsMono Nerd Font"
osd-border-size=2

# --- Audio --------------------------------------------------------------
volume=70
volume-max=150
audio-file-auto=fuzzy
alang=eng,en,spa,es
slang=eng,en,spa,es

# --- Subtitles ----------------------------------------------------------
sub-auto=fuzzy
sub-font="JetBrainsMono Nerd Font"
sub-font-size=40
sub-border-size=1.6
sub-bold=yes

# --- Screenshots --------------------------------------------------------
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template="%F-%P-%#04n"

# --- Network ------------------------------------------------------------
# yt-dlp handles the sites mpv cannot resolve alone; only used when present.
ytdl-format=bv*+ba/b
cache=yes
demuxer-max-bytes=256MiB

# --- Quiet --------------------------------------------------------------
msg-level=all=warn
term-osd=no
input-default-bindings=yes
input-vo-keyboard=yes

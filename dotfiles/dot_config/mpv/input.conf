# Archway — mpv keys. vim motions for seeking, plus the two things a laptop
# keyboard actually uses: volume on the media keys and a quick crop toggle.

j          seek -5
k          seek 5
J          seek -30
K          seek 30
l          seek 60
h          seek -60
SPACE      cycle pause
f          cycle fullscreen
o          cycle osc
m          cycle mute
i          show-progress
v          cycle sub-visibility
s          screenshot
S          screenshot video
# Volume steps that match the bar and the media keys.
9          add volume -2
0          add volume 2
# Left/right adjust speed, up/down volume: the same as every other player.
LEFT       seek -10
RIGHT      seek 10
UP         add volume 2
DOWN       add volume -2
# Keep a clip in sync when it drifts (live streams, damaged files).
[          add audio-delay 0.100
]          add audio-delay -0.100
# Screen recording / presentation habit: pause on the last frame.
ESC        quit-watch-later
q          quit-watch-later

; Archway polybar — one bar, dense but readable, keyboard-independent.
; Colours are generated into ~/.config/archway/theme.d/polybar.ini (Android Mount).

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
border-size = 0
padding-left = 12
padding-right = 12
module-margin-left = 1
module-margin-right = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Inter:size=9;3"
font-2 = "Noto Sans:size=9;3"
modules-left = bspwm
modules-center = date
modules-right = pulseaudio network cpu memory tray
tray-position = right
tray-padding = 2
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 2
label-occupied = %index%
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-padding = 2
label-urgent = %index%!
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2
label-empty = %index%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 2
label-separator = " "

[module/date]
type = internal/date
interval = 5
date = "%a %d %b"
time = "%H:%M"
label = " %date%  %time% "
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = " vol %percentage%% "
label-volume = " vol %percentage%% "
label-muted = " muted "
label-muted-foreground = ${colors.alert}
label-volume-foreground = ${colors.foreground}
ramp-volume = ""
click-right = pavucontrol

[module/network]
type = internal/network
interface = auto
interval = 5
format-connected = " %{A1:nm-connection-editor:}%signal%%%{A} "
format-disconnected = " offline "
label-disconnected = " offline "
label-disconnected-foreground = ${colors.alert}
format-wifi = " %signal%% "
format-ethernet = " lan "
format-linked = " link "
ping-interval = 10

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = " "
format = " %percentage:2%% "
label = " %percentage:2%% "

[module/memory]
type = internal/memory
interval = 5
format-prefix = " "
format = " %percentage:2%% "
label = " %percentage:2%% "

[module/tray]
type = internal/tray
format-margin = 6
tray-spacing = 6

; Generated Android Mount palette (must come last so [colors] is available).
include-file = ~/.config/archway/theme.d/polybar.ini

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false

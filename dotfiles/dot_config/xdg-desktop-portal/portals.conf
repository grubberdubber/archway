# With Hyprland, `xdg-desktop-portal-hyprland` is the default backend, and it
# does not implement the FileChooser interface at all. Pinning it explicitly to
# GTK means an upload dialog is always a GTK3 dialog: it follows
# ~/.config/gtk-3.0/gtk.css (and therefore the Archway theme), it floats under
# the Hyprland rule in hyprland.lua, and Ctrl+click / keyboard shortcuts behave
# like every other GTK window on the desktop.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland

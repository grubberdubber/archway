# Archway hyprlock — colours, size and font come from the generated theme.
# Everything here is behaviour the theme cannot know: what it is, who is
# logging in, and which key does what.

source = ~/.config/archway/theme.d/hyprlock.conf

auth {
    pam:enabled = true
    # Three attempts, then the input field only accepts Enter. Failures are
    # shown by the theme's fail_text.
    pam:module = login
}

label {
    monitor =
    text = $USER
    color = 0xFFFFFFFF
    font_size = 14
    font_family = Inter
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter to unlock   Esc to clear
    color = 0x99FFFFFF
    font_size = 11
    font_family = Inter
    position = 0, 10
    halign = center
    valign = bottom
}

# Escape clears the field instead of leaving a half-typed password on screen.
# Hyprland's lock surface is not part of the session, so this is handled by
# hyprlock's own keys.

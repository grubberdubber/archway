# Archway hypridle — dim, lock, suspend. Locking before suspend matters: a
# resume on a train should never show the last screen to the seat neighbour.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    # A lock command that hangs would block the idle daemon forever.
    ignore_dbus_inhibit = false
}

# 2 min: screen off (the laptop is probably being read, not used).
listener {
    timeout = 120
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 9 min: lock, with a notification 10 s before so a long read is not
# interrupted without warning.
listener {
    timeout = 530
    on-timeout = notify-send -a Archway -u low "Locking in 10 s" "Super+L to stay"
}

listener {
    timeout = 540
    on-timeout = loginctl lock-session
}

# 20 min: suspend. Resume needs the password because the session is locked.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}

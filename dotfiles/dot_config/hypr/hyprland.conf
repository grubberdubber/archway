# Archway Hyprland session. Managed by chezmoi — local edits are reported by
# `archway update` instead of being overwritten silently.
#
# Session entry: start Hyprland through uwsm (ADR-013) so the compositor and
# its components get a clean systemd lifecycle. Nothing here changes the
# display manager or the user's default session.

# Colours, gaps, rounding, blur: generated by `archway theme set`.
source = ~/.config/archway/theme.d/hyprland.conf
# Keybinds: generated by `archway keys generate` from keybinds/keybinds.toml.
source = ~/.config/hypr/conf.d/20-keybinds.conf

monitor = , preferred, auto, 1

input {
    kb_layout    = us
    kb_options   = compose:ralt
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

general {
    layout            = dwindle
    allow_tearing     = false
    resize_on_border  = true
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo     = true
    disable_splash_rendering  = true
    force_default_wallpaper   = 0
    focus_on_activate         = true
    mouse_move_enables_dpms   = true
}

# Accessibility: honour the reduce_motion palette flag when it is set.
# (The reduced-motion profile ships with animations disabled in the theme.)

# Floating scratchpad and dialogs. `floating-term` is what Super+Shift+Return,
# yazi and the cheatsheet launch, so a single rule keeps them consistent.
windowrule = float, class:^(floating-term)$
windowrule = size 70% 60%, class:^(floating-term)$
windowrule = center, class:^(floating-term)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$

# Session components. Started from the compositor so they exit with it; when
# the session came from uwsm they inherit its systemd scope.
exec-once = waybar
exec-once = swaync
exec-once = hypridle

# XWayland stays enabled for legacy X11 clients (documented, not hidden).
xwayland {
    force_zero_scaling = false
}

# Generated by archway from keybinds/keybinds.toml. Do not edit.
# Regenerate: archway keys generate

# --- apps ---

bind = SUPER, Return, exec, kitty
bind = SUPER SHIFT, Return, exec, kitty --class floating-term
bind = SUPER, D, exec, rofi -show drun
bind = SUPER, E, exec, kitty --class floating-term -e yazi
bind = SUPER, B, exec, ${BROWSER:-firefox}
bind = SUPER SHIFT, P, exec, rofi -show run -display-name 'Archway'

# --- windows ---

bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, togglefloating

# --- navigation ---

bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER ALT, H, resizeactive, 20 0
bind = SUPER ALT, J, resizeactive, 0 20
bind = SUPER ALT, K, resizeactive, 0 -20
bind = SUPER ALT, L, resizeactive, -20 0

# --- workspaces ---

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# --- archway ---

bind = SUPER, space, exec, rofi -show theme -modi 'theme:archway applet theme-selector'
bind = SUPER SHIFT, M, exec, archway applet android-mount --rofi
bind = SUPER, V, exec, cliphist list | rofi -dmenu -display-columns 2 -p clipboard | cliphist decode | wl-copy
bind = SUPER SHIFT, S, exec, archway applet screenshot region
bind = , Print, exec, archway applet screenshot full
bind = SUPER, P, exec, rofi-rbw --type password --action copy

# --- system ---

bind = SUPER SHIFT, Q, exec, archway applet power --rofi
bind = SUPER, Escape, exec, hyprlock
bind = SUPER ALT, R, reload
bind = SUPER SHIFT, E, exec, command -v uwsm >/dev/null 2>&1 && uwsm stop || hyprctl dispatch exit
bind = SUPER, slash, exec, kitty --class floating-term -e archway keys list

# --- media ---

binde = , XF86AudioRaiseVolume, exec, pamixer -i 5 && notify-send -t 800 -h int:value:$(pamixer --get-volume) -h string:x-canonical-private-synchronous:volume volume $(pamixer --get-volume)%
binde = , XF86AudioLowerVolume, exec, pamixer -d 5 && notify-send -t 800 -h int:value:$(pamixer --get-volume) -h string:x-canonical-private-synchronous:volume volume $(pamixer --get-volume)%
bind = , XF86AudioMute, exec, pamixer -t && notify-send -t 800 -h string:x-canonical-private-synchronous:volume 'mute' $(pamixer --get-mute)
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


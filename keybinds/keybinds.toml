# SPDX-License-Identifier: GPL-3.0-or-later
# Archway keybinds — the single source of truth.
#
# `archway keys generate` writes:
#   dotfiles/dot_config/sxhkd/sxhkdrc
#   docs/keybinds.md
# `archway keys validate` rejects duplicates, empty commands and reserved
# combinations. Edit here, never in the generated files.

[[keybind]]
id = "terminal"
keys = "super + Return"
command = "kitty"
category = "apps"
description = "Terminal"

[[keybind]]
id = "terminal-floating"
keys = "super + shift + Return"
command = "kitty --class floating-term"
category = "apps"
description = "Floating scratchpad terminal"

[[keybind]]
id = "launcher"
keys = "super + d"
command = "rofi -show drun"
category = "apps"
description = "Application launcher"

[[keybind]]
id = "file-manager"
keys = "super + e"
command = "kitty --class floating-term -e yazi"
category = "apps"
description = "File manager (yazi)"

[[keybind]]
id = "browser"
keys = "super + b"
command = "exec ${BROWSER:-firefox}"
category = "apps"
description = "Web browser"

[[keybind]]
id = "command-palette"
keys = "super + shift + p"
command = "rofi -show run -display-name 'Archway'"
category = "apps"
description = "Run a command (archway, system tools)"

[[keybind]]
id = "window-close"
keys = "super + q"
command = "bspc node -c"
category = "windows"
description = "Close focused window"

[[keybind]]
id = "window-fullscreen"
keys = "super + f"
command = "bspc node -t ~fullscreen"
category = "windows"
description = "Toggle fullscreen"

[[keybind]]
id = "window-floating"
keys = "super + shift + f"
command = "bspc node -t ~floating"
category = "windows"
description = "Toggle floating"

[[keybind]]
id = "focus-west"
keys = "super + h"
command = "bspc node -f west"
category = "navigation"
description = "Focus west"

[[keybind]]
id = "focus-south"
keys = "super + j"
command = "bspc node -f south"
category = "navigation"
description = "Focus south"

[[keybind]]
id = "focus-north"
keys = "super + k"
command = "bspc node -f north"
category = "navigation"
description = "Focus north"

[[keybind]]
id = "focus-east"
keys = "super + l"
command = "bspc node -f east"
category = "navigation"
description = "Focus east"

[[keybind]]
id = "move-west"
keys = "super + shift + h"
command = "bspc node -s west"
category = "navigation"
description = "Swap window west"

[[keybind]]
id = "move-south"
keys = "super + shift + j"
command = "bspc node -s south"
category = "navigation"
description = "Swap window south"

[[keybind]]
id = "move-north"
keys = "super + shift + k"
command = "bspc node -s north"
category = "navigation"
description = "Swap window north"

[[keybind]]
id = "move-east"
keys = "super + shift + l"
command = "bspc node -s east"
category = "navigation"
description = "Swap window east"

[[keybind]]
id = "resize-west"
keys = "super + alt + h"
command = "bspc node -z right -20 0 || bspc node -z left -20 0"
category = "navigation"
description = "Shrink horizontally"

[[keybind]]
id = "resize-south"
keys = "super + alt + j"
command = "bspc node -z bottom 0 20 || bspc node -z top 0 20"
category = "navigation"
description = "Shrink vertically"

[[keybind]]
id = "resize-north"
keys = "super + alt + k"
command = "bspc node -z top 0 -20 || bspc node -z bottom 0 -20"
category = "navigation"
description = "Grow vertically"

[[keybind]]
id = "resize-east"
keys = "super + alt + l"
command = "bspc node -z left 20 0 || bspc node -z right 20 0"
category = "navigation"
description = "Grow horizontally"


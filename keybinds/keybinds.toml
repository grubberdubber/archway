[[keybind]]
id = "theme-selector"
keys = "super + space"
command = "rofi -show theme -modi 'theme:archway applet theme-selector'"
category = "archway"
description = "Theme selector"

[[keybind]]
id = "android-mount"
keys = "super + shift + m"
command = "archway applet android-mount --rofi"
category = "archway"
description = "Mount / unmount Android device (MTP)"

[[keybind]]
id = "clipboard-history"
keys = "super + v"
command = "cliphist list | rofi -dmenu -display-columns 2 -p clipboard | cliphist decode | xclip -selection clipboard"
category = "archway"
description = "Clipboard history"

[[keybind]]
id = "screenshot-region"
keys = "super + shift + s"
command = "archway applet screenshot region"
category = "archway"
description = "Screenshot: region"

[[keybind]]
id = "screenshot-full"
keys = "Print"
command = "archway applet screenshot full"
category = "archway"
description = "Screenshot: whole screen"

[[keybind]]
id = "password-manager"
keys = "super + p"
command = "rofi-rbw --type password --action copy"
category = "archway"
description = "Password manager (rbw)"

[[keybind]]
id = "power-menu"
keys = "super + shift + q"
command = "archway applet power --rofi"
category = "system"
description = "Power menu"

# AGENTS.md §10.2 lists both Super+L (lock) and Super+H/J/K/L (focus), which is
# a conflict; the validation test caught it. hjkl navigation wins, so locking
# moves to Super+Escape (and Super+Shift+Q remains the power menu).
[[keybind]]
id = "lock"
keys = "super + Escape"
command = "i3lock -c 0B0F14 -n"
category = "system"
description = "Lock screen"

[[keybind]]
id = "reload-wm"
keys = "super + alt + r"
command = "bspc wm -r"
category = "system"
description = "Reload window manager"

[[keybind]]
id = "logout"
keys = "super + shift + e"
command = "bspc quit"
category = "system"
description = "Log out of bspwm"

[[keybind]]
id = "cheatsheet"
keys = "super + slash"
command = "kitty --class floating-term -e archway keys list"
category = "system"
description = "Keybind cheatsheet"

[[keybind]]
id = "volume-up"
keys = "XF86AudioRaiseVolume"
command = "pamixer -i 5 && dunstify -t 800 -h int:value:$(pamixer --get-volume) volume $(pamixer --get-volume)%"
category = "media"
description = "Volume up"

[[keybind]]
id = "volume-down"
keys = "XF86AudioLowerVolume"
command = "pamixer -d 5 && dunstify -t 800 -h int:value:$(pamixer --get-volume) volume $(pamixer --get-volume)%"
category = "media"
description = "Volume down"

[[keybind]]
id = "volume-mute"
keys = "XF86AudioMute"
command = "pamixer -t && dunstify -t 800 'mute' $(pamixer --get-mute)"
category = "media"
description = "Toggle mute"

[[keybind]]
id = "media-play"
keys = "XF86AudioPlay"
command = "playerctl play-pause"
category = "media"
description = "Play / pause"

[[keybind]]
id = "media-next"
keys = "XF86AudioNext"
command = "playerctl next"
category = "media"
description = "Next track"

[[keybind]]
id = "media-prev"
keys = "XF86AudioPrev"
command = "playerctl previous"
category = "media"
description = "Previous track"

[[keybind]]
id = "brightness-up"
keys = "XF86MonBrightnessUp"
command = "brightnessctl set +5%"
category = "media"
description = "Brightness up"

[[keybind]]
id = "brightness-down"
keys = "XF86MonBrightnessDown"
command = "brightnessctl set 5%-"
category = "media"
description = "Brightness down"

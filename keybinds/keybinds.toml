# Archway keybinds — the single source of truth.
#
# `archway keys generate` writes:
#   dotfiles/dot_config/hypr/conf.d/20-keybinds.conf
#   docs/keybinds.md
# `archway keys validate` rejects duplicates, empty actions and reserved
# combinations. Edit here, never in the generated files.
#
# Each entry needs either `command` (run with `exec`) or `dispatcher` (a native
# Hyprland dispatcher such as `killactive`). `argument` is optional.
# `repeat = "yes"` emits `binde` so holding the key keeps firing.

[[keybind]]
id = "terminal"
keys = "super + Return"
command = "$HOME/.local/bin/archway applet terminal"
category = "apps"
description = "Terminal (opens towards the cursor)"

[[keybind]]
id = "terminal-floating"
keys = "super + shift + Return"
command = "kitty --class floating-term"
category = "apps"
description = "Floating scratchpad terminal"

[[keybind]]
id = "launcher"
keys = "super + d"
command = "rofi -show drun"
category = "apps"
description = "Application launcher"

[[keybind]]
id = "file-manager"
keys = "super + e"
command = "kitty --class floating-term -e yazi"
category = "apps"
description = "File manager (yazi)"

[[keybind]]
id = "browser"
keys = "super + b"
command = "${BROWSER:-firefox}"
category = "apps"
description = "Web browser"

[[keybind]]
id = "command-palette"
keys = "super + shift + p"
command = "rofi -show run -display-name 'Archway'"
category = "apps"
description = "Run a command (archway, system tools)"

[[keybind]]
id = "window-close"
keys = "super + q"
dispatcher = "killactive"
category = "windows"
description = "Close focused window"

[[keybind]]
id = "window-fullscreen"
keys = "super + f"
dispatcher = "fullscreen"
argument = "0"
category = "windows"
description = "Toggle fullscreen"

[[keybind]]
id = "window-floating"
keys = "super + shift + f"
dispatcher = "togglefloating"
category = "windows"
description = "Toggle floating"

[[keybind]]
id = "focus-west"
keys = "super + h"
dispatcher = "movefocus"
argument = "l"
category = "navigation"
description = "Focus west"

[[keybind]]
id = "focus-south"
keys = "super + j"
dispatcher = "movefocus"
argument = "d"
category = "navigation"
description = "Focus south"

[[keybind]]
id = "focus-north"
keys = "super + k"
dispatcher = "movefocus"
argument = "u"
category = "navigation"
description = "Focus north"

[[keybind]]
id = "focus-east"
keys = "super + l"
dispatcher = "movefocus"
argument = "r"
category = "navigation"
description = "Focus east"

[[keybind]]
id = "move-west"
keys = "super + shift + h"
dispatcher = "movewindow"
argument = "l"
category = "navigation"
description = "Move window west"

[[keybind]]
id = "move-south"
keys = "super + shift + j"
dispatcher = "movewindow"
argument = "d"
category = "navigation"
description = "Move window south"

[[keybind]]
id = "move-north"
keys = "super + shift + k"
dispatcher = "movewindow"
argument = "u"
category = "navigation"
description = "Move window north"

[[keybind]]
id = "move-east"
keys = "super + shift + l"
dispatcher = "movewindow"
argument = "r"
category = "navigation"
description = "Move window east"

[[keybind]]
id = "resize-west"
keys = "super + alt + h"
dispatcher = "resizeactive"
argument = "20 0"
category = "navigation"
description = "Grow horizontally"

[[keybind]]
id = "resize-south"
keys = "super + alt + j"
dispatcher = "resizeactive"
argument = "0 20"
category = "navigation"
description = "Grow vertically"

[[keybind]]
id = "resize-north"
keys = "super + alt + k"
dispatcher = "resizeactive"
argument = "0 -20"
category = "navigation"
description = "Shrink vertically"

[[keybind]]
id = "resize-east"
keys = "super + alt + l"
dispatcher = "resizeactive"
argument = "-20 0"
category = "navigation"
description = "Shrink horizontally"

[[keybind]]
id = "workspace-1"
keys = "super + 1"
dispatcher = "workspace"
argument = "1"
category = "workspaces"
description = "Workspace 1"

[[keybind]]
id = "workspace-2"
keys = "super + 2"
dispatcher = "workspace"
argument = "2"
category = "workspaces"
description = "Workspace 2"

[[keybind]]
id = "workspace-3"
keys = "super + 3"
dispatcher = "workspace"
argument = "3"
category = "workspaces"
description = "Workspace 3"

[[keybind]]
id = "workspace-4"
keys = "super + 4"
dispatcher = "workspace"
argument = "4"
category = "workspaces"
description = "Workspace 4"

[[keybind]]
id = "workspace-5"
keys = "super + 5"
dispatcher = "workspace"
argument = "5"
category = "workspaces"
description = "Workspace 5"

[[keybind]]
id = "workspace-6"
keys = "super + 6"
dispatcher = "workspace"
argument = "6"
category = "workspaces"
description = "Workspace 6"




[[keybind]]
id = "send-workspace-1"
keys = "super + shift + 1"
dispatcher = "movetoworkspace"
argument = "1"
category = "workspaces"
description = "Move window to workspace 1"

[[keybind]]
id = "send-workspace-2"
keys = "super + shift + 2"
dispatcher = "movetoworkspace"
argument = "2"
category = "workspaces"
description = "Move window to workspace 2"

[[keybind]]
id = "send-workspace-3"
keys = "super + shift + 3"
dispatcher = "movetoworkspace"
argument = "3"
category = "workspaces"
description = "Move window to workspace 3"

[[keybind]]
id = "send-workspace-4"
keys = "super + shift + 4"
dispatcher = "movetoworkspace"
argument = "4"
category = "workspaces"
description = "Move window to workspace 4"

[[keybind]]
id = "send-workspace-5"
keys = "super + shift + 5"
dispatcher = "movetoworkspace"
argument = "5"
category = "workspaces"
description = "Move window to workspace 5"

[[keybind]]
id = "send-workspace-6"
keys = "super + shift + 6"
dispatcher = "movetoworkspace"
argument = "6"
category = "workspaces"
description = "Move window to workspace 6"




[[keybind]]
id = "theme-selector"
keys = "super + space"
command = "rofi -show theme -modi \"theme:$HOME/.local/bin/archway applet theme-selector\""
category = "archway"
description = "Theme selector"

[[keybind]]
id = "android-mount"
keys = "super + shift + m"
command = "$HOME/.local/bin/archway applet android-mount --rofi"
category = "archway"
description = "Mount / unmount Android device (MTP)"

[[keybind]]
id = "clipboard-history"
keys = "super + v"
command = "$HOME/.local/bin/archway applet clipboard --rofi"
category = "archway"
description = "Clipboard history"

[[keybind]]
id = "network-menu"
keys = "super + shift + n"
command = "$HOME/.local/bin/archway applet network --rofi"
category = "archway"
description = "Wi-Fi menu"

[[keybind]]
id = "wallpaper-picker"
keys = "super + alt + w"
command = "$HOME/.local/bin/archway applet wallpaper --rofi"
category = "archway"
description = "Wallpaper picker"

[[keybind]]
id = "screenshot-region"
keys = "super + shift + s"
command = "$HOME/.local/bin/archway applet screenshot region"
category = "archway"
description = "Screenshot: region"

[[keybind]]
id = "screenshot-full"
keys = "Print"
command = "$HOME/.local/bin/archway applet screenshot full"
category = "archway"
description = "Screenshot: whole screen"

[[keybind]]
id = "password-manager"
keys = "super + p"
command = "rofi-rbw --type password --action copy"
category = "archway"
description = "Password manager (rbw)"

[[keybind]]
id = "power-menu"
keys = "super + shift + q"
command = "$HOME/.local/bin/archway applet power --rofi"
category = "system"
description = "Power menu"

# AGENTS.md §10.2 lists both Super+L (lock) and Super+H/J/K/L (focus), which is
# a conflict; the validation test caught it. hjkl navigation wins, so locking
# stays on Super+Escape (AGENTS.md was corrected to match).
[[keybind]]
id = "lock"
keys = "super + Escape"
command = "hyprlock"
category = "system"
description = "Lock screen"

[[keybind]]
id = "reload-wm"
keys = "super + alt + r"
dispatcher = "reload"
category = "system"
description = "Reload Hyprland config"

[[keybind]]
id = "logout"
keys = "super + shift + e"
command = "command -v uwsm >/dev/null 2>&1 && uwsm stop || hyprctl dispatch exit"
category = "system"
description = "Log out of the session"

[[keybind]]
id = "cheatsheet"
keys = "super + slash"
command = "$HOME/.local/bin/archway keys list | rofi -dmenu -i -p Keybinds"
category = "system"
description = "Keybind cheatsheet"

[[keybind]]
id = "volume-up"
keys = "XF86AudioRaiseVolume"
command = "$HOME/.local/bin/archway applet osd volume up"
category = "media"
description = "Volume up"
repeat = "yes"

[[keybind]]
id = "volume-down"
keys = "XF86AudioLowerVolume"
command = "$HOME/.local/bin/archway applet osd volume down"
category = "media"
description = "Volume down"
repeat = "yes"

[[keybind]]
id = "volume-mute"
keys = "XF86AudioMute"
command = "$HOME/.local/bin/archway applet osd volume mute"
category = "media"
description = "Toggle mute"

[[keybind]]
id = "mic-mute"
keys = "XF86AudioMicMute"
command = "$HOME/.local/bin/archway applet osd mic mute"
category = "media"
description = "Toggle microphone mute"

[[keybind]]
id = "media-play"
keys = "XF86AudioPlay"
command = "playerctl play-pause"
category = "media"
description = "Play / pause"

[[keybind]]
id = "media-next"
keys = "XF86AudioNext"
command = "playerctl next"
category = "media"
description = "Next track"

[[keybind]]
id = "media-prev"
keys = "XF86AudioPrev"
command = "playerctl previous"
category = "media"
description = "Previous track"

[[keybind]]
id = "brightness-up"
keys = "XF86MonBrightnessUp"
command = "$HOME/.local/bin/archway applet osd brightness up"
category = "media"
description = "Brightness up"
repeat = "yes"

[[keybind]]
id = "brightness-down"
keys = "XF86MonBrightnessDown"
command = "$HOME/.local/bin/archway applet osd brightness down"
category = "media"
description = "Brightness down"
repeat = "yes"

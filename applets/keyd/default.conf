# Managed by Archway (applet: keyd).
# CapsLock: tap = Escape, hold = numpad under the right hand.
#
# Archway installs this file only when /etc/keyd/default.conf does not exist, or
# when you pass `--replace` (the previous file is kept next to it with a
# timestamp). A file without the marker above is never overwritten.
#
# Reload after editing: archway applet keyd reload

[ids]
*

[main]
capslock = overload(numpad, esc)

[numpad]
u = 7
i = 8
o = 9
j = 4
k = 5
l = 6
m = 1
, = 2
. = 3
n = 0
; = .
p = -
[ = +
y = *
h = /
